services:
  api:
    environment:
      KOMSU_ALLOWED_ORIGINS: '${KOMSU_DEMO_ALLOWED_ORIGINS:-["http://127.0.0.1:8080","http://localhost:8080"]}'
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.demo
    restart: unless-stopped
    ports:
      - '${KOMSU_DEMO_BIND:-127.0.0.1}:${KOMSU_DEMO_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
