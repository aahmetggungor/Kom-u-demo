name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q --junitxml=backend-results.xml
      - run: python scripts/configure_local.py && docker compose up -d --build db
      - run: |
          for attempt in $(seq 1 30); do
            docker compose exec -T db pg_isready -U postgres -d komsu && break
            sleep 2
          done
          alembic upgrade head
          KOMSU_RUN_POSTGRES_TESTS=1 pytest tests/test_postgres.py -q --junitxml=postgres-results.xml
      - run: docker compose build api migrate
      - run: pip install pip-audit bandit && pip-audit -r requirements.lock && bandit -r services/api/src -ll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '*-results.xml'
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test && npm run build && npm audit --audit-level=high
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :relay:test :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            apps/mobile/**/build/test-results/**/*.xml
            apps/mobile/app/build/reports/lint-results-debug.html
