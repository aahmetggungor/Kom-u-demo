[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "komsu"
version = "0.1.0"
description = "Human-led multilingual disaster coordination foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141,<0.142", "uvicorn[standard]>=0.52,<0.53", "sqlalchemy>=2.0.52,<2.1", "alembic>=1.20,<1.21", "psycopg[binary]>=3.3,<3.4", "pydantic-settings>=2.15,<2.16", "prometheus-client>=0.26,<0.27", "httpx>=0.28,<0.29", "cryptography>=50,<51"]

[project.optional-dependencies]
test = ["pytest>=9.1,<9.2", "ruff>=0.16,<0.17"]
models = [
  "sentence-transformers>=5,<6",
  "sentencepiece>=0.2,<0.3",
  "sacremoses>=0.1,<0.2",
]

[project.scripts]
komsu = "komsu.cli:main"

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires dedicated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
